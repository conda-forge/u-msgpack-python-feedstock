{% set name = "u-msgpack-python" %}
{% set version = "2.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 3f632940c2db108d71210795463e249b47e89a08eec0d54a5cdc1a202505ede9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - umsgpack

about:
  home: https://github.com/vsergeev/u-msgpack-python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A portable, lightweight MessagePack serializer and deserializer written in pure Python.
  dev_url: https://github.com/vsergeev/u-msgpack-python

extra:
  recipe-maintainers:
    - tschoonj
